<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>
    
    <div class="card">
        <div class="house-container">
            <img 
                src="images/house.png" 
                alt="Luxury house"
                class="house-image"
            >
        </div>


        <div class="card-content">

            <div class="price-row">
                <h1>&#163; 3,273,279</h1>
                <span>For sale</span>
            </div>

            <h2 class="name-house">Luxury 5-bed Villa</h2>

            <p class="location">
               <i class="fa-solid fa-location-dot"></i> 29 Terrace Rd, BH2 5EL
            </p>

            <div class="details">

                <p>
                    <i class="fa-solid fa-ruler-combined"></i>
                    1634 <span>sqft</span>
                </p>

                <p>
                    <i class="fa-solid fa-bed"></i>
                    5 <span>bed</span>
                </p>

                <p>
                    <i class="fa-solid fa-bath"></i>
                    3 <span>bath</span>
                </p>

            </div>
            <div class="agent">

                <img 
                src="images/shimabdinzade-woman-8378634_1920.jpg" alt=""
                >

                <div class="agent-details">
                    <strong>Jennifer Bloom</strong>
                    <p>+44 235 123 321</p>
                </div>
    
            </div>
        </div>
    </div>
</body>
</html>
